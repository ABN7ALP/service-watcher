<title>المحفظة والشحن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Baloo+Bhaijaan+2:wght@700;800&display=swap">
<style>
/* Layout: phone stage (wallet) + architecture rail. Single dark look matching the app. */
:root{
  --bg:#07050c; --s1:#15101f; --s2:#1d1629; --s3:#251c35; --line:#2c2340;
  --fg:#f3eefb; --muted:#9a8fb0; --gold:#ffcf5a; --gold2:#ff9f1c; --pink:#ff4fa3; --violet:#8b5cff; --mint:#3be0b0; --cyan:#43d9ff; --red:#ff6b6b;
  --f-ui:"Cairo",system-ui,sans-serif; --f-num:"Baloo Bhaijaan 2","Cairo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0}
.page{max-width:1120px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px;font-weight:900}
.lead{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.7;max-width:76ch}
.modebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.modebar span{font-size:12px;color:var(--muted)}
.modebar button{font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);background:#ffffff08;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.modebar button[aria-pressed="true"]{background:var(--gold);color:#3a2300;border-color:var(--gold)}
.wrap{display:flex;gap:24px;align-items:flex-start}
@media (max-width:880px){.wrap{flex-direction:column;align-items:center}}

/* phone */
.phone{position:relative;width:min(390px,100%);height:min(820px,88vh);min-height:640px;border-radius:32px;overflow:hidden;background:var(--s1);box-shadow:0 0 0 8px #1a1424,0 30px 80px #000a;flex:none;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 14px 90px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px;flex:none}
.hdr h2{margin:0;font-size:17px;font-weight:900}
.hdr .hist{font:inherit;font-size:12px;font-weight:800;color:var(--muted);background:#ffffff0c;border:0;border-radius:999px;padding:5px 12px}
.bals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 10px;flex:none}
.bal{border-radius:16px;padding:10px 8px;background:linear-gradient(160deg,#2a1f3d,#1a1426);border:1px solid #ffffff10}
.bal small{display:block;font-size:10.5px;color:var(--muted);font-weight:800}
.bal b{font-family:var(--f-num);font-size:17px;display:flex;align-items:center;gap:4px;direction:ltr;unicode-bidi:isolate;justify-content:flex-end}
.bal.c b{color:var(--gold)} .bal.d b{color:var(--cyan)} .bal.u b{color:var(--mint)}
.ic{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.ic.coin{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffcf5a 45%,#d48a12)}
.ic.gem{background:linear-gradient(135deg,#bff4ff,#43d9ff 50%,#1f7fd0);transform:rotate(45deg);border-radius:3px;width:11px;height:11px}
.tabs{display:flex;margin:0 14px 10px;background:#0000003a;border-radius:14px;padding:3px;flex:none}
.tabs button{flex:1;font:inherit;font-size:13px;font-weight:800;color:var(--muted);background:none;border:0;border-radius:11px;padding:8px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--s3);color:var(--fg)}

/* first recharge hero */
.hero{position:relative;border-radius:18px;padding:12px 14px;margin-bottom:10px;background:linear-gradient(120deg,#ff4fa3,#8b5cff 60%,#3d2a8a);overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffffff40,transparent 60%)}
.hero .t{font-size:11px;font-weight:900;letter-spacing:.02em;background:#00000033;border-radius:999px;padding:2px 9px;display:inline-block}
.hero h3{margin:6px 0 2px;font-size:19px;font-weight:900}
.hero p{margin:0;font-size:12px;opacity:.92}
.hero .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hero .cd{font-family:var(--f-num);font-size:13px;font-weight:800;background:#00000040;border-radius:10px;padding:1px 8px;direction:ltr;unicode-bidi:isolate}

/* milestone */
.mile{border-radius:16px;background:var(--s2);border:1px solid var(--line);padding:10px 12px;margin-bottom:12px}
.mile .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.mile .row b{color:var(--gold)}
.mtrack{position:relative;height:8px;border-radius:8px;background:#ffffff12;margin:0 30px}
.mfill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:8px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.nodes{position:relative;height:46px;margin:0 30px}
.node{position:absolute;top:-14px;transform:translateX(50%);display:flex;flex-direction:column;align-items:center;font-size:9.5px;color:var(--muted);font-weight:800;text-align:center;line-height:1.3;width:64px}
.node i{width:20px;height:20px;border-radius:50%;background:var(--s3);border:2px solid #ffffff22;display:grid;place-items:center;font-style:normal;font-size:11px;margin-bottom:2px}
.node.done i{background:var(--gold);border-color:var(--gold)}
.node.done{color:var(--gold)}

/* methods */
.sec{font-size:12px;font-weight:900;color:var(--muted);margin:4px 2px 8px;display:flex;justify-content:space-between}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mth{position:relative;text-align:start;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);color:var(--fg);font:inherit;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.mth[aria-pressed="true"]{border-color:var(--mint);background:radial-gradient(90% 90% at 80% 0%,#3be0b022,transparent),var(--s2)}
.mth .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.mth b{display:block;font-size:13px}
.mth small{display:block;font-size:10.5px;color:var(--muted)}
.mth .tag{position:absolute;top:-8px;inset-inline-start:8px;font-size:9.5px;font-weight:900;background:var(--mint);color:#062a22;border-radius:6px;padding:0 6px}

/* packages */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pk{position:relative;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);color:var(--fg);font:inherit;padding:12px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pk[aria-pressed="true"]{border-color:var(--gold);background:radial-gradient(90% 80% at 50% 0%,#ffcf5a26,transparent),var(--s2)}
.pk .amt{font-family:var(--f-num);font-size:16px;font-weight:800;display:flex;align-items:center;gap:3px}
.pk .bon{font-size:10px;font-weight:900;color:var(--mint);min-height:15px}
.pk .usd{margin-top:3px;font-family:var(--f-num);font-size:13px;font-weight:800;background:#ffffff12;border-radius:999px;padding:1px 10px;direction:ltr;unicode-bidi:isolate}
.pk .rib{position:absolute;top:-8px;inset-inline-start:6px;font-size:9px;font-weight:900;border-radius:6px;padding:0 5px;background:var(--gold);color:#3a2300}
.pk .x2{position:absolute;top:-8px;inset-inline-end:6px;font-size:9px;font-weight:900;border-radius:6px;padding:0 5px;background:var(--pink);color:#fff}
.summary{border-radius:14px;background:#0000002e;border:1px dashed #ffffff22;padding:10px 12px;font-size:12px;margin-bottom:10px}
.summary .l{display:flex;justify-content:space-between;padding:2px 0}
.summary .l b{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate}
.summary .tot{border-top:1px solid #ffffff14;margin-top:5px;padding-top:6px;font-size:13.5px}
.summary .tot b{color:var(--gold)}
.cta{position:absolute;inset-inline:14px;bottom:14px;height:50px;border-radius:16px;border:0;font:inherit;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(90deg,#ff4fa3,#ff7a59);box-shadow:0 8px 24px #ff4fa355;cursor:pointer;z-index:3}
.cta.mint{background:linear-gradient(90deg,#14b98d,#3be0b0);color:#062a22;box-shadow:0 8px 24px #3be0b044}
.cta:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.trust{display:flex;gap:10px;justify-content:center;font-size:10.5px;color:var(--muted);margin:4px 0 8px}

/* agents */
.agent{display:flex;gap:10px;align-items:center;border-radius:14px;background:var(--s2);border:1px solid var(--line);padding:10px;margin-bottom:8px}
.agent .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none;position:relative}
.agent .av::after{content:"";position:absolute;bottom:1px;inset-inline-end:1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--s2)}
.agent .av.off::after{background:#6b6280}
.agent .inf{flex:1;min-width:0}
.agent .inf b{display:flex;gap:4px;align-items:center;font-size:13px}
.vb{font-size:9.5px;background:#43d9ff26;color:#9eeaff;border-radius:6px;padding:0 5px;font-weight:900}
.agent .inf small{display:block;font-size:10.5px;color:var(--muted)}
.agent .rate{font-family:var(--f-num);font-size:12px;color:var(--gold);font-weight:800}
.agent button{font:inherit;font-size:11.5px;font-weight:900;border:0;border-radius:10px;padding:7px 10px;background:var(--mint);color:#062a22;cursor:pointer;flex:none}
.warn{border-radius:12px;background:#ff6b6b14;border:1px solid #ff6b6b44;padding:8px 10px;font-size:11.5px;line-height:1.7;margin:8px 0 12px;color:#ffd4d4}

/* redeem / withdraw */
.card{border-radius:16px;background:var(--s2);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.card h4{margin:0 0 8px;font-size:13.5px}
.inp{display:flex;align-items:center;gap:8px;background:#0005;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.inp input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-family:var(--f-num);font-size:20px;font-weight:800;outline:none;direction:ltr;unicode-bidi:isolate;text-align:left}
.inp .max{font:inherit;font-size:11px;font-weight:900;color:var(--gold);background:#ffcf5a1a;border:0;border-radius:8px;padding:3px 8px;cursor:pointer}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;font-family:var(--f-num);font-weight:800;font-size:12.5px;border:1px solid var(--line);background:#ffffff08;color:var(--fg);border-radius:10px;padding:5px 0;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border-radius:14px;border:1.5px solid var(--line);background:var(--s2);color:var(--fg);font:inherit;padding:10px;cursor:pointer;text-align:start;position:relative}
.opt[aria-pressed="true"]{border-color:var(--gold)}
.opt small{display:block;font-size:10.5px;color:var(--muted)}
.opt b{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:18px;margin-top:2px;direction:ltr;unicode-bidi:isolate;justify-content:flex-end}
.opt .tag{position:absolute;top:-8px;inset-inline-start:8px;font-size:9.5px;font-weight:900;background:var(--gold);color:#3a2300;border-radius:6px;padding:0 6px}
.saved{display:flex;align-items:center;gap:10px}
.saved .logo{width:38px;height:38px;border-radius:10px;background:#e4002b;display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.saved .inf{flex:1}
.saved .inf b{display:block;font-family:var(--f-num);font-size:15px;direction:ltr;unicode-bidi:isolate;text-align:end}
.saved .inf small{color:var(--mint);font-size:10.5px;font-weight:800}
.saved button{font:inherit;font-size:11px;font-weight:800;color:var(--muted);background:#ffffff0c;border:0;border-radius:8px;padding:4px 8px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12px}
.timeline li i{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:10px;margin-top:1px;background:var(--s3);border:2px solid #ffffff22}
.timeline li.ok i{background:var(--mint);border-color:var(--mint);color:#062a22}
.timeline li.now i{background:var(--gold);border-color:var(--gold);color:#3a2300;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffcf5a22}}
.timeline li small{display:block;color:var(--muted);font-size:10.5px}
.wd{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0c;font-size:12px}
.wd:last-child{border:0}
.st{font-size:10.5px;font-weight:900;border-radius:6px;padding:1px 7px}
.st.ok{background:#3be0b022;color:var(--mint)} .st.wait{background:#ffcf5a22;color:var(--gold)} .st.hold{background:#8b5cff26;color:#c9b4ff}

/* modal */
.modal{position:absolute;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end}
.mbox{width:100%;max-height:92%;overflow-y:auto;background:var(--s2);border-radius:22px 22px 0 0;padding:14px 14px 18px;border-top:1px solid #ffffff18}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mhead h3{margin:0;font-size:16px}
.mhead button{width:30px;height:30px;border-radius:50%;border:0;background:#ffffff10;color:var(--fg);cursor:pointer}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:4px;border-radius:4px;background:#ffffff18}
.steps i.on{background:var(--mint)}
.kv{display:flex;justify-content:space-between;align-items:center;background:#0000003a;border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:12.5px}
.kv b{font-family:var(--f-num);font-size:15px;direction:ltr;unicode-bidi:isolate}
.kv .cp{font:inherit;font-size:10.5px;font-weight:900;color:var(--mint);background:#3be0b01a;border:0;border-radius:8px;padding:3px 8px;margin-inline-start:6px;cursor:pointer}
.ref{font-family:var(--f-num);font-size:22px;letter-spacing:.08em;color:var(--gold)}
.qr{width:120px;height:120px;margin:4px auto 10px;border-radius:12px;background:#fff;display:grid;place-items:center}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin:6px 0 12px}
.mbtn{width:100%;height:46px;border-radius:14px;border:0;font:inherit;font-weight:900;font-size:14px;cursor:pointer;background:linear-gradient(90deg,#14b98d,#3be0b0);color:#062a22}
.mbtn.sec2{background:#ffffff10;color:var(--fg);margin-top:8px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
.field input{width:100%;height:44px;border-radius:12px;background:#0005;border:1px solid var(--line);color:var(--fg);font-family:var(--f-num);font-size:16px;padding:0 12px;direction:ltr;unicode-bidi:isolate;text-align:left}
.upload{border:1.5px dashed #ffffff30;border-radius:12px;padding:12px;text-align:center;font-size:12px;color:var(--muted)}
.pin{display:flex;gap:10px;justify-content:center;margin:8px 0 12px}
.pin span{width:44px;height:50px;border-radius:12px;background:#0005;border:1.5px solid var(--line);display:grid;place-items:center;font-size:22px}
.pin span.f{border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{height:44px;border-radius:12px;border:0;background:#ffffff0c;color:var(--fg);font-family:var(--f-num);font-size:18px;font-weight:800;cursor:pointer}

/* play mode */
.play-note{border-radius:14px;background:#43d9ff12;border:1px solid #43d9ff40;padding:12px;font-size:12px;line-height:1.8;color:#cdf6ff;margin-bottom:10px}

/* toast */
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:30;background:#000d;border:1px solid #ffffff22;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}

/* rail */
.rail{flex:1;min-width:0;font-size:13px;line-height:1.85;color:#d8d0e8;max-width:470px}
.rail h2{font-size:15px;color:var(--gold);margin:14px 0 4px}
.rail h2:first-child{margin-top:0}
.rail ul{margin:0;padding-inline-start:18px}
.rail code{font-family:ui-monospace,monospace;font-size:11.5px;background:#ffffff10;padding:1px 5px;border-radius:5px;direction:ltr;unicode-bidi:isolate;unicode-bidi:isolate}
.flow{font-family:ui-monospace,monospace;font-size:11px;background:#0b0811;border:1px solid var(--line);border-radius:10px;padding:10px;direction:ltr;unicode-bidi:isolate;white-space:pre;overflow-x:auto;color:#b9f5d4;line-height:1.6}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="page" dir="rtl">
  <h1>المحفظة والشحن</h1>
  <p class="lead">نموذج تفاعلي كامل: الشحن بالعروض، شام كاش بخطوات واضحة، الوكلاء المعتمدون، الاستبدال، والسحب. بدّل بين "الموقع" و"تطبيق Google Play" لترى ما يُخفى في نسخة المتجر.</p>
  <div class="modebar"><span>النسخة:</span>
    <button type="button" data-mode="web" aria-pressed="true">الموقع</button>
    <button type="button" data-mode="play" aria-pressed="false">تطبيق Google Play</button>
    <span style="margin-inline-start:12px">المستخدم:</span>
    <button type="button" data-first="1" aria-pressed="true">لم يشحن بعد</button>
    <button type="button" data-first="0" aria-pressed="false">شحن سابقاً</button>
  </div>
  <div class="wrap">
    <div class="phone" id="phone"></div>
    <div class="rail" id="rail"></div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const RATE = 1000;                       // coins per $ (server setting)
const PACKS = [
  {usd:1, bonus:0}, {usd:5, bonus:0}, {usd:10, bonus:.10, hot:true},
  {usd:25, bonus:.12}, {usd:50, bonus:.15}, {usd:100, bonus:.20, tag:'+ بوكس ذهبي'}
];
const SHAM_EXTRA = .05;                 // recommended method bonus
const FIRST_MAX_USD = 5;                // first recharge doubles up to $5
const AGENTS = [
  ['أبو كرم للشحن','#ff9f1c',4.9,1240,'يرد خلال دقيقتين',1100,true],
  ['نور ستور','#8b5cff',4.8,860,'يرد خلال 5 دقائق',1080,true],
  ['مكتب الشام','#2bb7a8',4.7,2110,'غير متصل الآن',1050,false],
];
let S = { mode:'web', first:true, tab:'recharge', method:'sham', pack:2, custom:'',
  coins:12500, beans:486000, usd:42.5, monthUSD:12, redeemTo:'coins', redeemAmt:200000, wdAmt:20 };

/* ---------- helpers ---------- */
function calc(){
  const p = S.custom ? {usd:Math.max(1,Math.min(1000,+S.custom||0)), bonus:0} : PACKS[S.pack];
  const base = p.usd*RATE;
  const pkBonus = base*p.bonus;
  const methodBonus = S.method==='sham' ? base*SHAM_EXTRA : 0;
  const firstBonus = S.first ? Math.min(p.usd, FIRST_MAX_USD)*RATE : 0;
  return {p, base, pkBonus, methodBonus, firstBonus, total: base+pkBonus+methodBonus+firstBonus};
}
function toast(t){ const d = document.createElement('div'); d.className='toast'; d.textContent=t; $('phone').appendChild(d); setTimeout(()=>d.remove(),1800); }
let cdEnd = Date.now() + (23*3600+59*60+12)*1000;
function cdText(){ const s = Math.max(0, Math.floor((cdEnd-Date.now())/1000)); const h=String(Math.floor(s/3600)).padStart(2,'0'), m=String(Math.floor(s%3600/60)).padStart(2,'0'), x=String(s%60).padStart(2,'0'); return `${h}:${m}:${x}`; }

/* ---------- screens ---------- */
function rechargeHTML(){
  if (S.mode==='play') return `<div class="play-note"><b>نسخة Google Play:</b> لا تظهر هنا أي طريقة شحن، ولا أي نص أو رابط يوجّه المستخدم للشحن خارج التطبيق. هذا شرط سياسة Google للعملات الافتراضية. المستخدم يستطيع استخدام كوينزه، والاستبدال، والسحب فقط.</div>
    <div class="card"><h4>كوينزك</h4><div style="font-family:var(--f-num);font-size:26px;color:var(--gold);direction:ltr;unicode-bidi:isolate;text-align:end">${fmt(S.coins)}</div></div>`;
  const c = calc();
  const goal = 50, pct = Math.min(100, S.monthUSD/goal*100);
  return `

function render(){
  const ph = $('phone');
  const tabs = S.mode==='play' ? [['recharge','كوينزي'],['redeem','استبدال'],['withdraw','سحب']] : [['recharge','شحن'],['redeem','استبدال'],['withdraw','سحب']];
  let body = S.tab==='recharge' ? rechargeHTML() : S.tab==='redeem' ? redeemHTML() : withdrawHTML();
  let cta = '';
  if (S.tab==='recharge' && S.mode==='web' && S.method==='sham'){ const c = calc(); cta = `<button class="cta" id="cta" type="button">ادفع $${c.p.usd} عبر شام كاش ← ${fmt(c.total)} كوينز</button>`; }
  if (S.tab==='redeem') cta = `<button class="cta mint" id="cta" type="button">استبدل ${fmt(S.redeemAmt)} ألماسة</button>`;
  if (S.tab==='withdraw') cta = `<button class="cta mint" id="cta" type="button" ${S.wdAmt<5||S.wdAmt>S.usd?'disabled':''}>اسحب $${(+S.wdAmt||0).toFixed(2)}</button>`;
  ph.innerHTML = `<div class="hdr"><h2>المحفظة</h2><button class="hist" type="button">السجل</button></div>
    <div class="bals"><div class="bal c"><small>كوينز</small><b><i class="ic coin"></i>${fmt(S.coins)}</b></div><div class="bal d"><small>ألماس</small><b><i class="ic gem"></i>${fmt(S.beans)}</b></div><div class="bal u"><small>رصيد قابل للسحب</small><b>$${S.usd.toFixed(2)}</b></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</div>
    <div class="scroll">${body}</div>${cta}`;
  bind(); rail();
}
function bind(){
  const ph = $('phone');
  ph.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  ph.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.method=b.dataset.m;render();});
  ph.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.pack=+b.dataset.p;S.custom='';render();});
  ph.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{S.redeemTo=b.dataset.to;render();});
  ph.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.redeemAmt=+b.dataset.r;render();});
  ph.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>agentModal(b.dataset.agent));
  const cu=$('custom'); if(cu){cu.onchange=()=>{S.custom=cu.value.replace(/[^\d.]/g,'');render();};}
  const ra=$('ramt'); if(ra){ra.onchange=()=>{S.redeemAmt=Math.min(S.beans,Math.max(0,parseInt(ra.value)||0));render();};}
  const rm=$('rmax'); if(rm) rm.onclick=()=>{S.redeemAmt=S.beans;render();};
  const wa=$('wamt'); if(wa){wa.onchange=()=>{S.wdAmt=Math.max(0,parseFloat(wa.value)||0);render();};}
  const wm=$('wmax'); if(wm) wm.onclick=()=>{S.wdAmt=Math.min(300,S.usd);render();};
  const cta=$('cta'); if(cta) cta.onclick = S.tab==='recharge'?shamModal : S.tab==='redeem'?doRedeem : pinModal;
}

function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="mbox">${html}</div>`; $('phone').appendChild(m); m.onclick=e=>{if(e.target===m)m.remove();}; m.querySelector('[data-close]')?.addEventListener('click',()=>m.remove()); return m; }

      <button class="mbtn" type="button" id="n1">حوّلت المبلغ</button><button class="mbtn sec2" type="button" data-close>لاحقاً</button>`;
    if (step===2) box.innerHTML = `<div class="mhead"><h3>تأكيد التحويل</h3><button data-close type="button">✕</button></div><div class="steps"><i class="on"></i><i class="on"></i><i></i></div>

      <div class="upload">📎 صورة الإيصال (اختياري، يسرّع التحقق)</div>

      <button class="mbtn" type="button" id="n2">أرسل للتحقق</button>`;
    if (step===3) box.innerHTML = `<div class="mhead"><h3>طلبك قيد التحقق</h3><button data-close type="button">✕</button></div><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
      <ul class="timeline"><li class="ok"><i>✓</i><span>استلمنا طلبك<small>${ref} · $${amt}</small></span></li><li class="now"><i>•</i><span>نطابق التحويل مع حسابنا<small>عادة أقل من 10 دقائق</small></span></li><li><i></i><span>تُضاف ${fmt(c.total)} كوينز لحسابك<small>تصلك رسالة فوراً</small></span></li></ul>

function agentModal(name){

function doRedeem(){
  if (S.redeemAmt<=0 || S.redeemAmt>S.beans) return toast('أدخل كمية صحيحة');

  if (S.redeemTo==='coins'){ S.coins += S.redeemAmt; toast(`✅ +${fmt(S.redeemAmt)} كوينز هدية`); }
  else { toast(`⏳ $${(S.redeemAmt/RATE*.7).toFixed(2)} في فترة الأمان 72 ساعة`); }
  render();
}
