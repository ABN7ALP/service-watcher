<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Room — Responsive Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS — every size in the room derives from the room's own box
   (container query units cqw / cqh), so the same CSS fits 320px → 430px+
   and short screens without anything overlapping.
   ===================================================================== */
:root{
  --gold:#ffd45a; --gold-2:#f0a81c; --ink:#fff; --ink-2:#d9d2ee; --ink-3:#9a91b8;
  --us-1:#ff4f8b; --us-2:#ff9a5a; --them-1:#3d7bff; --them-2:#5fd4ff;
  --glass:rgba(20,12,34,.46); --glass-line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:#08060d;font-family:Cairo,'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px 40px}
.controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px}
.controls .grp{display:flex;gap:4px;padding:4px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff18}
.controls button{font:700 12px Cairo;padding:6px 11px;border-radius:999px;border:0;background:transparent;color:#cfc8e6;cursor:pointer}
.controls button.on{background:linear-gradient(#ffd45a,#c98200);color:#2a1600}
.cap{font-size:11.5px;color:#8e86a8;text-align:center}

/* ---------------- device ---------------- */
.device{width:390px;height:844px;border-radius:38px;padding:9px;background:linear-gradient(#2a2433,#121016);box-shadow:0 30px 80px #000c,inset 0 0 0 1.5px #ffffff1a;flex:none}
.room{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;container-type:size;container-name:room;
  display:flex;flex-direction:column;isolation:isolate;
  padding:max(env(safe-area-inset-top),6px) 0 max(env(safe-area-inset-bottom),6px)}

/* fluid scale: one unit everything hangs on */
.room{--u:clamp(9px,2.75cqw,12px)}

/* background */
.bg{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60cqw 40cqh at 80% 8%,#7a2bd855,transparent 70%),
  radial-gradient(70cqw 45cqh at 10% 40%,#d0287a40,transparent 70%),
  radial-gradient(80cqw 50cqh at 60% 100%,#2b5bd844,transparent 70%),
  linear-gradient(180deg,#1b0f2e,#0e0918 55%,#08060d)}
.bg::before{content:"";position:absolute;inset:0;opacity:.55;background-image:
  radial-gradient(circle at 20% 30%,#fff3 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff2 0 1px,transparent 2px),
  radial-gradient(circle at 40% 70%,#fff2 0 1px,transparent 2px),radial-gradient(circle at 85% 60%,#fff3 0 1px,transparent 2px);
  background-size:120px 140px,160px 120px,140px 180px,110px 130px}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006,transparent 18%,transparent 60%,#000a)}

/* ---------------- header ---------------- */
.hdr{display:flex;align-items:center;gap:calc(var(--u)*.5);padding:calc(var(--u)*.4) calc(var(--u)*.9);flex:none}
.rinfo{display:flex;align-items:center;gap:calc(var(--u)*.55);min-width:0;max-width:52cqw;padding:3px;padding-inline-end:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(8px)}
.rinfo .cover{width:calc(var(--u)*3.1);height:calc(var(--u)*3.1);border-radius:50%;object-fit:cover;flex:none}
.rinfo .txt{min-width:0;line-height:1.2}
.rinfo .nm{font-weight:800;font-size:calc(var(--u)*1.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo .meta{display:flex;gap:4px;align-items:center;font-size:calc(var(--u)*.82);color:var(--ink-3);white-space:nowrap}
.lv{font-weight:900;font-size:calc(var(--u)*.78);padding:0 5px;border-radius:5px;background:linear-gradient(90deg,#7b5cff,#c04cff);color:#fff}
.follow{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;border:0;flex:none;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(#ff6fa6,#e0306f);color:#fff;font:900 calc(var(--u)*1.4) Cairo;box-shadow:0 0 10px #ff4f8b88}
.follow.on{background:transparent;box-shadow:none}
.follow img{width:120%;height:120%}
.sp{flex:1}
.tops{display:flex;flex-direction:row-reverse}
.tops img{width:calc(var(--u)*2.5);height:calc(var(--u)*2.5);border-radius:50%;border:1.5px solid var(--gold);margin-inline-start:calc(var(--u)*-.7);background:#222}
.tops img:nth-child(2){border-color:#cfd8e6}.tops img:nth-child(3){border-color:#d58a4a}
.pill{display:flex;align-items:center;gap:4px;height:calc(var(--u)*2.5);padding:0 calc(var(--u)*.7);border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  font:700 calc(var(--u)*.95) Cairo;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.ibtn{width:calc(var(--u)*2.5);height:calc(var(--u)*2.5);flex:none;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:#fff;
  display:grid;place-items:center;font-size:calc(var(--u)*1.1);cursor:pointer}

/* sub row: league chip + support + notice */
.sub{display:flex;gap:calc(var(--u)*.5);padding:0 calc(var(--u)*.9);align-items:center;flex:none;margin-top:2px}
.chip{display:flex;align-items:center;gap:4px;height:calc(var(--u)*2.1);padding:0 calc(var(--u)*.65);border-radius:999px;font:800 calc(var(--u)*.85) Cairo;white-space:nowrap;flex:none}
.chip img{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5)}
.chip--gold{background:linear-gradient(90deg,#ffd45a2e,#f0a81c14);border:1px solid #ffd45a66;color:#ffe9a8}
.chip--glass{background:var(--glass);border:1px solid var(--glass-line);color:var(--ink-2)}
.notice{flex:1;min-width:0;overflow:hidden;height:calc(var(--u)*2.1);border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);
  display:flex;align-items:center;font-size:calc(var(--u)*.85);color:var(--ink-2);-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.notice span{white-space:nowrap;padding-inline-start:100%;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(100%)}}

/* gift banner (slides in under header, never covers seats) */
.lane{position:relative;flex:none;height:0;z-index:20}
.gban{position:absolute;top:calc(var(--u)*.8);inset-inline-start:calc(var(--u)*.9);max-width:78cqw;display:flex;align-items:center;gap:6px;
  padding:3px calc(var(--u)*1);padding-inline-start:3px;border-radius:999px;background:linear-gradient(90deg,#ff4f8bdd,#7a2bd8bb);box-shadow:0 6px 18px #0008;
  font-size:calc(var(--u)*.9);transform:translateX(120%);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .3s}
.gban.on{transform:none;opacity:1}
.gban img.a{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;border:1.5px solid #fff}
.gban b{font-weight:800}
.gban .g{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6)}
.gban .x{font:900 calc(var(--u)*1.5) Cairo;color:#ffe27a;text-shadow:0 2px 0 #7a3300;font-style:italic}

/* ---------------- seats ---------------- */
.stage{flex:none;padding:calc(var(--u)*.6) calc(var(--u)*.6) 0;
  --cols:4;
  /* seat avatar size: limited by width AND height so short phones shrink seats instead of overlapping chat */
  --av:min(calc((100cqw - 2*var(--u) - (var(--cols) - 1)*6px) / var(--cols) * .64), 7.6cqh, 64px);
  --hostAv:min(calc(var(--av) * 1.32), 10cqh, 84px)}
.room[data-seats="13"] .stage{--cols:4}
.room[data-seats="19"] .stage{--cols:6}
.room[data-seats="80"] .stage{--cols:8;--av:min(calc((100cqw - 2*var(--u) - 7*4px) / 8 * .72), 5.2cqh, 40px)}
.host{display:flex;justify-content:center;margin-bottom:calc(var(--u)*.3)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:calc(var(--u)*.35) 6px}
.room[data-seats="80"] .grid{max-height:30cqh;overflow-y:auto;scrollbar-width:none;gap:4px;
  -webkit-mask:linear-gradient(#000 85%,transparent)}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seat__av{position:relative;width:var(--av);height:var(--av);flex:none}
.host .seat__av{width:var(--hostAv);height:var(--hostAv)}
.seat__img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;position:relative;z-index:2}
.seat__empty{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;
  background:radial-gradient(circle at 50% 35%,#ffffff22,#ffffff08 70%);border:1.5px dashed #ffffff33;color:#ffffffaa;font-size:calc(var(--av)*.36)}
.seat__empty.lock{border-style:solid;border-color:#ffffff1f;color:#ffffff66}
.seat__ring{position:absolute;inset:-3px;border-radius:50%;z-index:1;border:2px solid transparent}
.seat.vip .seat__ring{border-color:var(--gold);box-shadow:0 0 10px #ffd45a77}
.seat.host-seat .seat__ring{inset:-5px;border:2.5px solid transparent;background:conic-gradient(from var(--r,0deg),#ffd45a,#ff4f8b,#7a2bd8,#3d7bff,#ffd45a) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ring 5s linear infinite}
@property --r{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ring{to{--r:360deg}}
/* speaking: two soft ripples behind the avatar */
.seat__wave{position:absolute;inset:0;border-radius:50%;z-index:0;opacity:0}
.seat.talk .seat__wave{animation:wave 1.4s ease-out infinite;background:radial-gradient(circle,transparent 58%,#7cf3ff88 62%,transparent 72%)}
.seat.talk .seat__wave+.seat__wave{animation-delay:.7s}
@keyframes wave{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.seat__mic{position:absolute;z-index:3;bottom:-2px;inset-inline-end:-2px;width:calc(var(--av)*.34);height:calc(var(--av)*.34);min-width:14px;min-height:14px;border-radius:50%;
  background:#1b1426;border:1.5px solid #ffffff44;display:grid;place-items:center;font-size:calc(var(--av)*.18)}
.seat__no{position:absolute;z-index:3;top:-2px;inset-inline-start:-2px;min-width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-radius:99px;background:#000a;border:1px solid #ffffff33;
  font:800 calc(var(--u)*.72) Cairo;display:grid;place-items:center;padding:0 3px}
.seat__badge{position:absolute;z-index:3;top:calc(var(--av)*-.28);left:50%;transform:translateX(-50%);width:calc(var(--av)*.48)}
.seat__name{margin-top:calc(var(--u)*.35);max-width:100%;font:700 calc(var(--u)*.85) Cairo;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);text-shadow:0 1px 2px #000}
.seat__sup{display:flex;align-items:center;gap:2px;font:800 calc(var(--u)*.72) Cairo;color:#ffe08a;line-height:1.1;font-variant-numeric:tabular-nums}
.seat__sup::before{content:"";width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffc531 50%,#a86a00)}
.seat.empty .seat__name{color:var(--ink-3);font-weight:600}
.room[data-seats="80"] .seat__name,.room[data-seats="80"] .seat__sup{display:none}
/* emoji reaction popping on a seat */
.react{position:absolute;z-index:6;top:0;left:50%;width:calc(var(--av)*.9);transform:translate(-50%,0);pointer-events:none;animation:react 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes react{0%{transform:translate(-50%,10%) scale(.2);opacity:0}25%{transform:translate(-50%,-10%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-55%) scale(.9);opacity:0}}

/* ---------------- PK slot (compact) ---------------- */
.pk{flex:none;margin:calc(var(--u)*.6) calc(var(--u)*.9) 0;display:none}
.room.pk-on .pk{display:block}
.pk__row{display:flex;align-items:center;justify-content:space-between;font:800 calc(var(--u)*.85) Cairo;margin-bottom:3px}
.pk__clock{padding:0 8px;border-radius:999px;background:#1a0f05cc;border:1px solid #ffd45a77;color:var(--gold);font-variant-numeric:tabular-nums}
.pk__bar{position:relative;height:calc(var(--u)*1.8);border-radius:999px;overflow:hidden;display:flex;box-shadow:0 0 0 1.5px #ffffff22}
.pk__us{width:58%;background:linear-gradient(270deg,var(--us-1),var(--us-2));transition:width .5s}
.pk__them{flex:1;background:linear-gradient(90deg,var(--them-1),var(--them-2))}
.pk__bar span{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 8px;font:900 calc(var(--u)*.9) Cairo;text-shadow:0 1px 2px #000a}
.pk__bar .a{right:0}.pk__bar .b{left:0}
.pk__knot{position:absolute;top:-4px;bottom:-4px;width:3px;margin-right:-1.5px;background:#fff;box-shadow:0 0 10px #fff;transition:right .5s}
.pk__rider{position:absolute;bottom:100%;width:calc(var(--u)*2.4);margin-right:calc(var(--u)*-1.2);transition:right .5s;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---------------- chat (takes all remaining height, never under seats) ---------------- */
.chat{flex:1 1 auto;min-height:calc(var(--u)*8);position:relative;margin-top:calc(var(--u)*.6);display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 22%)}
.msgs{overflow-y:auto;padding:0 calc(var(--u)*.9);display:flex;flex-direction:column;gap:calc(var(--u)*.35);scrollbar-width:none;max-width:86cqw}
.msg{align-self:flex-start;max-width:100%;padding:calc(var(--u)*.35) calc(var(--u)*.75);border-radius:calc(var(--u)*1.1);background:#00000055;backdrop-filter:blur(6px);
  font-size:calc(var(--u)*.95);line-height:1.5;word-break:break-word;animation:in .35s ease}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.msg .who{font-weight:800;color:#9fd0ff}
.msg .who.vip{color:#ffd45a}
.msg .lvb{display:inline-block;font:900 calc(var(--u)*.7) Cairo;padding:0 4px;border-radius:4px;margin-inline-end:3px;vertical-align:1px;color:#fff;background:linear-gradient(90deg,#3d7bff,#7b5cff)}
.msg .lvb.hi{background:linear-gradient(90deg,#f0a81c,#ff4f8b)}
.msg.sys{background:#ffd45a1a;border:1px solid #ffd45a33;color:#ffe9a8;font-size:calc(var(--u)*.85)}
.msg.gift{background:linear-gradient(90deg,#ff4f8b40,#7a2bd830);border:1px solid #ff8ab855}
.msg.gift img{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);vertical-align:-4px}
.join{align-self:flex-start;margin:0 calc(var(--u)*.9) calc(var(--u)*.4);padding:2px calc(var(--u)*.8);border-radius:999px;font-size:calc(var(--u)*.85);
  background:linear-gradient(90deg,#3d7bff55,transparent);color:#d6e6ff;opacity:0;transform:translateX(30px);transition:.4s}
.join.on{opacity:1;transform:none}

/* ---------------- dock ---------------- */
.dock{flex:none;display:flex;align-items:center;gap:calc(var(--u)*.55);padding:calc(var(--u)*.6) calc(var(--u)*.9) 0}
.input{flex:1;min-width:0;height:calc(var(--u)*3.4);min-height:38px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);display:flex;align-items:center;
  padding:0 calc(var(--u)*1.1);font-size:calc(var(--u)*1);color:var(--ink-3)}
.dbtn{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);min-width:38px;min-height:38px;flex:none;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);
  color:#fff;display:grid;place-items:center;font-size:calc(var(--u)*1.35);cursor:pointer;position:relative}
.dbtn.mic.on{background:linear-gradient(#3ee08f,#11a865);border-color:transparent}
.dbtn.gift{background:linear-gradient(135deg,#ffb020,#ff4f8b 60%,#7a2bd8);border:0;box-shadow:0 0 14px #ff4f8b88;animation:gpulse 2.2s ease-in-out infinite}
@keyframes gpulse{50%{transform:scale(1.08);box-shadow:0 0 22px #ff4f8bcc}}
.dbtn .dot{position:absolute;top:2px;inset-inline-end:2px;min-width:16px;height:16px;border-radius:99px;background:#ff3d55;font:900 9px Cairo;display:grid;place-items:center;padding:0 3px}

/* ---------------- breakpoints by the room's own size ---------------- */
@container room (max-height:640px){
  .sub .notice{display:none}
  .seat__sup{display:none}
  .host{margin-bottom:0}
}
@container room (max-width:340px){
  .tops img:nth-child(3){display:none}
  .chip--glass{display:none}
  .rinfo{max-width:46cqw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="controls">
  <div class="grp" id="gDev">
    <button data-w="320" data-h="568">320×568 (SE)</button>
    <button data-w="360" data-h="640">360×640</button>
    <button data-w="375" data-h="667">375×667</button>
    <button data-w="390" data-h="844" class="on">390×844</button>
    <button data-w="430" data-h="932">430×932</button>
  </div>
  <div class="grp" id="gSeats">
    <button data-s="9" class="on">9 مقاعد</button><button data-s="13">13</button><button data-s="19">19</button><button data-s="80">80</button>
  </div>
  <div class="grp"><button id="bPk">PK نشط</button></div>
</div>
<div class="cap" id="cap"></div>

<div class="device" id="dev">
 <div class="room" id="room" data-seats="9">
  <div class="bg"></div>

  <header class="hdr">
    <div class="rinfo">
      <img class="cover" id="cover" alt="">
      <div class="txt"><div class="nm">غرفة النجوم ✨ سهرة الشام</div>
        <div class="meta"><span class="lv">Lv.24</span><span>ID 482915</span></div></div>
      <button class="follow" id="follow" title="متابعة">+</button>
    </div>
    <div class="sp"></div>
    <div class="tops" id="tops"></div>
    <div class="pill" title="المشاهدون">👁 <span>1.2K</span></div>
    <button class="ibtn" title="خيارات">✕</button>

function build(n){
  $('room').dataset.seats=n;
  $('host').innerHTML=seatHTML({i:1,host:true,name:'أبو حسن (المضيف)',h:30,sup:'96.4K',talk:true});
  let html='';
  for(let i=2;i<=n;i++){
    const k=i-2, filled = n===80 ? k<34 : k < Math.min(n-1, n===9?6:n===13?9:13);
    const lock = !filled && (i===n);
    html+=seatHTML(filled?{i,name:NAMES[k%NAMES.length],h:(k*47)%360,sup:SUP[k%SUP.length],vip:k<2,muted:k%5===3}:{i,empty:true,lock});
  }
  $('grid').innerHTML=html;
}
/* speaking + reactions */
setInterval(()=>{
  const seats=[...document.querySelectorAll('.grid .seat:not(.empty)')];
  seats.forEach(s=>s.classList.remove('talk'));

let ci=0;
function pushMsg(){
  const m=CHAT[ci++%CHAT.length], el=document.createElement('div');
  if(m.t==='sys'){el.className='msg sys';el.textContent=m.x;}
  else if(m.t==='gift'){el.className='msg gift';el.innerHTML=`<span class="who vip">${m.w}</span> ${m.x} <img src="${EMO[m.g]}" alt=""> <b>${m.n}</b> إلى ${m.to}`;}
  else{el.className='msg';el.innerHTML=`<span class="lvb ${m.hi?'hi':''}">${m.lv}</span><span class="who ${m.vip?'vip':''}">${m.w}:</span> ${m.x}`;}
  const box=$('msgs'); box.append(el); while(box.children.length>30) box.firstChild.remove(); box.scrollTop=box.scrollHeight;
}
for(let i=0;i<6;i++) pushMsg();

/* PK mini */
let pa=12450,pb=9020;
setInterval(()=>{ if(!$('room').classList.contains('pk-on')) return; pa+=Math.random()*600|0; pb+=Math.random()*700|0;
  const s=pa/(pa+pb)*100; $('pkUs').style.width=s+'%'; $('pkKnot').style.right=s+'%'; $('pkRider').style.right=s+'%';
  $('pkA').textContent=pa.toLocaleString('en-US'); $('pkB').textContent=pb.toLocaleString('en-US');},900);

/* controls */
function setDev(w,h){$('dev').style.width=(w+18)+'px';$('dev').style.height=(h+18)+'px';$('cap').textContent=`${w}×${h} — كل الأحجام مشتقة من حجم الغرفة نفسها (container queries)`;}
document.querySelectorAll('#gDev button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#gDev button').forEach(x=>x.classList.toggle('on',x===b));setDev(+b.dataset.w,+b.dataset.h);});
document.querySelectorAll('#gSeats button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#gSeats button').forEach(x=>x.classList.toggle('on',x===b));build(+b.dataset.s);});
$('bPk').onclick=()=>{$('room').classList.toggle('pk-on');$('bPk').classList.toggle('on');};
const q=new URLSearchParams(location.search);
build(+(q.get('s')||9)); const w=+(q.get('w')||390), h=+(q.get('h')||844); setDev(w,h);
document.querySelectorAll('#gDev button').forEach(x=>x.classList.toggle('on',+x.dataset.w===w));
document.querySelectorAll('#gSeats button').forEach(x=>x.classList.toggle('on',x.dataset.s===(q.get('s')||'9')));
if(q.get('pk')){$('room').classList.add('pk-on');$('bPk').classList.add('on');}
if(q.get('f')) $('follow').click();
</script>
