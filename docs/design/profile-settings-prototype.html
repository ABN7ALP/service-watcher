<title>الملف الشخصي والإعدادات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Baloo+Bhaijaan+2:wght@700;800&display=swap">
<style>
/* Layout: page header (title + build-status toggle + jump chips) above one phone frame that runs a small screen stack. Single dark look, same as the app. */
:root{
  --bg:#0a0812;--phone:#100c19;--s1:#181324;--s2:#211a30;--line:#2d2440;
  --fg:#f2eefa;--muted:#968aac;--dim:#6c6180;
  --accent:#a46bff;--teal:#2fd4b4;--gold:#ffcc4d;--pink:#ff5fa8;--red:#ff6b6b;--amber:#ffb547;
  --f-ui:"Cairo",system-ui,sans-serif;--f-num:"Baloo Bhaijaan 2","Cairo",system-ui,sans-serif;
  color-scheme:dark
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:21px;font-weight:900;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 12px;max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:inset-inline-start .2s}
[aria-pressed="true"] .sw,.sw.on{background:var(--teal)}
[aria-pressed="true"] .sw::after,.sw.on::after{inset-inline-start:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.jump button{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.jump button.cur{color:var(--fg);border-color:var(--accent)}

/* status tags */
.st{display:none;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;line-height:1.6;flex:none}
.show-st .st{display:inline-block}
.legend .st{display:inline-block}
.st.have{background:#2fd4b422;color:var(--teal)}
.st.move{background:#a46bff26;color:#c8a6ff}
.st.new{background:#ffcc4d22;color:var(--gold)}
.st.later{background:#ffffff12;color:var(--muted)}

/* phone */
.phone{max-width:390px;margin:0 auto;background:var(--phone);border:1px solid var(--line);border-radius:28px;height:760px;max-height:calc(100vh - 40px);min-height:560px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--phone);border-bottom:1px solid var(--line)}
.top h2{font-size:15px;font-weight:900;margin:0;flex:1}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.ib:hover{background:var(--s2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate}

/* profile hero */
.cover{height:330px;background:
  radial-gradient(120px 90px at 80% 30%,#ff5fa855,transparent 70%),
  radial-gradient(160px 120px at 20% 60%,#a46bff66,transparent 70%),
  linear-gradient(160deg,#2a1d48,#151022);position:relative}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:62%;background:linear-gradient(transparent,#100c19ee 70%,var(--phone));pointer-events:none}
.cover .tools{z-index:2}
.bdg{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 3px;border-radius:99px;font-family:var(--f-num);font-size:12.5px;font-weight:800;direction:ltr}
.bdg i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:#fff}
.bdg i svg{width:11px;height:11px;stroke-width:2.4}
.bdg.w{background:linear-gradient(90deg,#ffb020,#ff7a1a);color:#fff}.bdg.w i{background:#0003}
.bdg.c{background:linear-gradient(90deg,#ff5fa8,#c04dff);color:#fff}.bdg.c i{background:#0003}
.bdg.a{background:linear-gradient(90deg,#16b89a,#2fd4b4);color:#fff;padding:0 3px}.bdg.a i{background:#0003}
.cover .tools{position:absolute;top:10px;inset-inline:10px;display:flex;justify-content:space-between}
.cover .tools .ib{background:#0006;backdrop-filter:blur(4px)}
.cover-edit{position:absolute;top:56px;inset-inline-end:10px;z-index:2;font-size:11px;font-weight:800;background:#0007;border-radius:8px;padding:3px 8px;display:flex;gap:4px;align-items:center}
.hero{position:absolute;bottom:0;inset-inline:0;z-index:2;padding:0 16px 12px}
.ava{width:88px;height:88px;border-radius:50%;position:relative;display:grid;place-items:center}
.ava::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),var(--pink),var(--accent),var(--gold));}
.ava span{position:relative;width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#3b2a63,#6a3fb8);display:grid;place-items:center;font-size:32px;font-weight:900;border:3px solid var(--phone)}
.name{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.name b{font-size:19px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;background:var(--s2)}
.chip.g{background:#4da3ff22;color:#7fbcff}
.chip.lv1{background:linear-gradient(90deg,#ffcc4d33,#ff9f1a22);color:var(--gold)}
.chip.lv2{background:linear-gradient(90deg,#ff5fa833,#a46bff22);color:#ff9fd0}
.idrow{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.copy{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:700}
.copy svg{width:14px;height:14px}
.bio{margin:8px 0 0;font-size:13px;line-height:1.7;color:#d9d1e8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 16px 0;background:var(--s1);border-radius:16px;padding:10px 0}
.stats button{display:flex;flex-direction:column;align-items:center;gap:0}
.stats b{font-family:var(--f-num);font-size:18px}
.stats small{font-size:11px;color:var(--muted);font-weight:700;display:flex;gap:3px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pink);display:inline-block}
.bal{margin:10px 16px 0;display:flex;gap:8px}
.bal button{flex:1;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#2b2140,#1d1730);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bal small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-align:start}
.bal b{font-family:var(--f-num);font-size:17px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 10px 0}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;font-size:11.5px;font-weight:700;position:relative}
.tile:hover{background:var(--s1)}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.tile .st{position:absolute;top:0;inset-inline-end:2px}
.tabs{display:flex;gap:18px;padding:0 16px;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 0;font-weight:800;color:var(--muted);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.pane{padding:12px 16px 90px}
.honor{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hcard{background:var(--s1);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.hcard small{color:var(--muted);font-size:11px;font-weight:700}
.hcard b{font-size:14px}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gift{background:var(--s1);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.gift i{display:block;width:34px;height:34px;margin:0 auto 4px;border-radius:10px}
.gift b{display:block;color:var(--fg);font-family:var(--f-num);font-size:13px}
.info{display:flex;flex-direction:column;gap:0;background:var(--s1);border-radius:14px}
.info div{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #ffffff0a;font-size:13px}
.info div:last-child{border:0}
.info span{color:var(--muted)}
.fab{position:absolute;bottom:0;inset-inline:0;display:flex;gap:8px;padding:10px 14px 14px;background:linear-gradient(transparent,var(--phone) 35%)}
.fab button{flex:1;border-radius:14px;padding:11px 0;font-weight:900;display:flex;gap:6px;justify-content:center;align-items:center}
.btn-p{background:linear-gradient(90deg,var(--accent),var(--pink));color:#fff}
.btn-s{background:var(--s2)}
.btn-t{background:linear-gradient(90deg,#2fd4b4,#3be08a);color:#06221c}

/* settings lists */
.sec{padding:8px 14px 0}
.sec h3{font-size:12px;color:var(--muted);font-weight:800;margin:10px 4px 6px;letter-spacing:.2px}
.list{background:var(--s1);border-radius:16px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #ffffff0a;text-align:start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--s2)}
.row .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.row .ri svg{width:18px;height:18px}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .t small{font-size:11.5px;color:var(--muted);line-height:1.5}
.row .v{font-size:12px;color:var(--muted);flex:none}
.row .v.warn{color:var(--amber);font-weight:800}
.row .v.ok{color:var(--teal);font-weight:800}
.row .chev{color:var(--dim);width:16px;height:16px}
.row.danger b{color:var(--red)}
.score{margin:10px 14px 0;background:linear-gradient(135deg,#2b2140,#1b1528);border:1px solid var(--line);border-radius:18px;padding:14px}
.score .h{display:flex;align-items:center;gap:10px}
.ring{width:54px;height:54px;flex:none}
.score h4{margin:0;font-size:14.5px;font-weight:900}
.score p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.checks button{display:flex;align-items:center;gap:8px;font-size:12.5px;background:#ffffff08;border-radius:10px;padding:8px 10px;text-align:start}
.checks .ok{color:var(--teal)}
.checks .no{color:var(--amber)}
.checks em{font-style:normal;margin-inline-start:auto;font-size:11.5px;color:var(--accent);font-weight:800}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.note{margin:10px 18px;font-size:11.5px;color:var(--muted);line-height:1.8}
.foot{text-align:center;color:var(--dim);font-size:11px;padding:16px 0 28px}
.form{padding:12px 16px 30px;display:flex;flex-direction:column;gap:12px}
.form label{font-size:12px;color:var(--muted);font-weight:800;display:flex;justify-content:space-between}
.form input,.form textarea,.form select{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;font-size:13.5px}
.form textarea{resize:none;height:70px}
.form .hint{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.devs .row .t b{font-size:13px}
.pill{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:#2fd4b422;color:var(--teal)}
.toast{position:absolute;bottom:18px;inset-inline:40px;background:#000c;border-radius:12px;padding:9px 12px;text-align:center;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.sheet{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:15}
.sheet>div{background:var(--s1);border-radius:20px 20px 0 0;padding:16px;width:100%}
.sheet h4{margin:0 0 6px;font-size:15px}
.sheet p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:440px){.phone{border-radius:20px;height:720px}}
</style>

<div class="wrap" dir="rtl">
  <h1>الملف الشخصي والإعدادات</h1>
  <p class="lead">نموذج تفاعلي للملف الشخصي الكامل وصفحة الإعدادات الجديدة. اضغط على أي سطر للتنقل. فعّل «حالة التنفيذ» لترى ما هو موجود في التطبيق وما يُنقل وما هو جديد.</p>

  </div>
  <div class="jump" id="jump"></div>
  <div class="phone" id="phone"><div class="scr" id="scr"></div><div class="toast" id="toast"></div></div>
</div>

function ring(a,b){ const r=22,c=2*Math.PI*r, f=c*a/b; const col=a===b?'var(--teal)':'var(--amber)';
  return `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="#ffffff14" stroke-width="6"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 27 27)"/><text x="27" y="32" text-anchor="middle" fill="var(--fg)" font-family="Baloo Bhaijaan 2,Cairo" font-size="15" font-weight="800">${a}/${b}</text></svg>`; }
function chk(ok,label,cta){ return `<button ${ok?'':'data-sheet="email"'}><span class="${ok?'ok':'no'}">${ic(ok?'check':'alert','style="width:16px;height:16px"')}</span>${label}${!ok&&cta?`<em>${cta}</em>`:''}</button>`; }

const sheets = {
  logout:['تسجيل الخروج؟','ستحتاج كلمة السر للدخول مرة أخرى على هذا الجهاز.','تسجيل الخروج','btn-p'],
  email:['تفعيل البريد','نرسل رمزاً من 6 أرقام إلى ba***@gmail.com. بعد التفعيل تستطيع استعادة كلمة السر ورمز السحب بنفسك دون الدعم.','أرسل الرمز','btn-t'],
  pw:['تغيير كلمة السر','تحتاج كلمة السر الحالية. بعد التغيير يخرج كل جهاز آخر تلقائياً.','متابعة','btn-t'],
  delete:['حذف الحساب','يُجمَّد الحساب 15 يوماً، وإذا دخلت خلالها يُلغى الحذف. بعدها تُحذف بياناتك ويُفقد أي رصيد غير مسحوب. اسحب رصيدك أولاً.','فهمت، متابعة','btn-s']
};

const scr = $('scr');
function render(){
  const k = stack[stack.length-1];
  scr.innerHTML = screens[k].render();
  scr.scrollTop = 0;
  $('jump').querySelectorAll('button').forEach(b=>b.classList.toggle('cur', b.dataset.j===k));
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }
function sheet(key){ const [h,p,b,cls]=sheets[key]; const d=document.createElement('div'); d.className='sheet';
  d.innerHTML=`<div><h4>${h}</h4><p>${p}</p><div style="display:flex;gap:8px"><button class="btn-s" style="flex:1;border-radius:12px;padding:10px 0;font-weight:800" data-x>إلغاء</button><button class="${cls}" style="flex:1;border-radius:12px;padding:10px 0;font-weight:900" data-x data-ok="${h}">${b}</button></div></div>`;
  d.addEventListener('click',e=>{ if(e.target===d||e.target.closest('[data-x]')){ const ok=e.target.closest('[data-ok]'); d.remove(); if(ok) toast('في التطبيق الحقيقي تتم العملية هنا'); }});
  $('phone').appendChild(d); }

scr.addEventListener('click', e => {
  const t = e.target.closest('button,[data-sw]'); if(!t) return;
  if (t.dataset.sw){ prefs[t.dataset.sw]=!prefs[t.dataset.sw]; render(); return; }
  if (t.dataset.seg){ prefs[t.dataset.seg]=t.dataset.v; render(); return; }
  if (t.hasAttribute('data-back')){ if(stack.length>1) stack.pop(); render(); return; }
  if (t.hasAttribute('data-visitor')){ state.visitor=true; render(); toast('هكذا يرى الآخرون ملفك'); return; }
  if (t.hasAttribute('data-back-visitor')){ state.visitor=false; render(); return; }
  if (t.dataset.tab){ state.tab=t.dataset.tab; render(); return; }
  if (t.dataset.go){ stack.push(t.dataset.go); render(); return; }
  if (t.dataset.sheet){ sheet(t.dataset.sheet); return; }
  if (t.dataset.toastBack){ stack.pop(); render(); toast(t.dataset.toastBack); return; }
  if (t.dataset.toast) toast(t.dataset.toast);
});

const path = { profile:['profile'], edit:['profile','edit'], settings:['profile','settings'], account:['profile','settings','account'], devices:['profile','settings','account','devices'],
  privacy:['profile','settings','privacy'], blocked:['profile','settings','privacy','blocked'], notifs:['profile','settings','notifs'], general:['profile','settings','general'], help:['profile','settings','help'] };
$('jump').innerHTML = Object.keys(path).map(k=>`<button data-j="${k}">${screens[k].label}</button>`).join('') + `<button data-j="visitor">كما يراه الزائر</button>`;
$('jump').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return;
  if (b.dataset.j==='visitor'){ stack.splice(0,stack.length,'profile'); state.visitor=true; }
  else { state.visitor=false; stack.splice(0,stack.length,...path[b.dataset.j]); }
  render(); });
$('stToggle').addEventListener('click', e => { const b=e.currentTarget; const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); $('phone').classList.toggle('show-st',on); });
render();
})();
</script>
