<title>نادي المعجبين النهائي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Baloo+Bhaijaan+2:wght@700;800&display=swap">
<style>
/* Layout: screen switcher, then phone frame beside a spec panel describing exactly what to build for the shown screen. Single dark look, same as the app. */
:root{
  --bg:#0a0812;--phone:#100c19;--s1:#181324;--s2:#211a30;--line:#2d2440;
  --fg:#f2eefa;--muted:#968aac;--dim:#6c6180;
  --accent:#a46bff;--teal:#2fd4b4;--gold:#ffcc4d;--pink:#ff5fa8;--red:#ff6b6b;
  --t1a:#c9773a;--t1b:#7a3e17;--t2a:#cfd8e3;--t2b:#6b7a8f;--t3a:#ffd45e;--t3b:#c27a0e;--t4a:#5eead4;--t4b:#0e7490;--t5a:#f0abfc;--t5b:#7e22ce;
  --f-ui:"Cairo",system-ui,sans-serif;--f-num:"Baloo Bhaijaan 2","Cairo",system-ui,sans-serif;
  color-scheme:dark
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:21px;font-weight:900;margin:0 0 4px}
.lead{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 14px;max-width:72ch}
.tabsx{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabsx button{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:800;font-size:12.5px;color:var(--muted)}
.tabsx button.on{color:var(--fg);border-color:var(--accent);background:#a46bff1c}
.layout{display:grid;grid-template-columns:390px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.phone{width:100%;max-width:390px;margin:0 auto;background:var(--phone);border:1px solid var(--line);border-radius:28px;height:780px;max-height:calc(100vh - 40px);min-height:560px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;overflow-x:hidden}
.spec{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.spec h2{font-size:15px;font-weight:900;margin:0 0 8px}
.spec h3{font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:900}
.spec ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.75}
.spec .warn{background:#ff6b6b14;border:1px solid #ff6b6b44;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.8;margin-top:10px}
.num{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--phone);border-bottom:1px solid var(--line)}
.top h2{font-size:15px;font-weight:900;margin:0;flex:1;text-align:center}
.ib{width:34px;height:34px;min-width:34px;border-radius:50%;display:grid;place-items:center;background:var(--s2);flex:none}
.pad{padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--s1);border-radius:16px;padding:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:900;margin-bottom:8px;gap:8px}
.sec-h small{font-weight:700;color:var(--muted);font-size:11.5px}
.note{font-size:11.5px;color:var(--muted);line-height:1.8;margin:0}
.btn{border-radius:14px;padding:12px;font-weight:900;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:linear-gradient(90deg,var(--pink),var(--accent));color:#fff}
.btn.s{background:var(--s2);color:var(--muted)}
.btn.ghost{background:transparent;color:var(--red);font-size:12.5px;padding:8px}
.price{display:inline-flex;align-items:center;gap:4px;background:#0003;border-radius:99px;padding:2px 10px;font-family:var(--f-num);font-size:13px}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;position:relative;font-size:15px;color:#fff}

/* club emblem + hero */
.hero{padding:18px 14px 14px;background:radial-gradient(180px 120px at 85% 10%,#ff5fa84d,transparent 70%),radial-gradient(200px 140px at 10% 90%,#a46bff40,transparent 70%),linear-gradient(170deg,#2a1b44,#140e22);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.emb{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--accent));box-shadow:0 8px 26px #ff5fa84d}
.emb svg{width:36px;height:36px;stroke:#fff;fill:#fff3}
.hero h3{margin:4px 0 0;font-size:19px;font-weight:900}
.hero .owner{font-size:12px;color:#d6c9ee}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-top:8px}
.stats3 div{background:#0003;border-radius:12px;padding:7px 4px}
.stats3 b{display:block;font-family:var(--f-num);font-size:17px}
.stats3 small{font-size:10.5px;color:#cbbfe3}

/* tier badge (CSS only, no images) */
.fb{display:inline-flex;align-items:center;height:20px;border-radius:99px;padding:0 7px 0 2px;gap:4px;font-size:10.5px;font-weight:900;color:#fff;flex:none;position:relative;overflow:hidden;white-space:nowrap}
.fb .lv{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:9.5px;background:#0004;box-shadow:inset 0 0 0 1px #fff5}
.fb.t1{background:linear-gradient(90deg,var(--t1a),var(--t1b))}
.fb.t2{background:linear-gradient(90deg,var(--t2a),var(--t2b));color:#152033}
.fb.t3{background:linear-gradient(90deg,var(--t3a),var(--t3b));color:#3a2200}
.fb.t4{background:linear-gradient(90deg,var(--t4a),var(--t4b))}
.fb.t5{background:linear-gradient(90deg,var(--t5a),var(--t5b))}
.fb.t3::after,.fb.t4::after,.fb.t5::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
.fb.off{filter:grayscale(1);opacity:.55}
.fb.off::after{display:none}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* level card */
.lvcard{display:flex;gap:12px;align-items:center}
.bigl{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-family:var(--f-num);font-size:24px;font-weight:800;color:#fff;flex:none;position:relative}
.bigl small{position:absolute;bottom:-8px;font-family:var(--f-ui);font-size:9.5px;background:var(--phone);border-radius:6px;padding:0 6px;color:var(--fg)}
.bar{height:9px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;gap:8px}
.state{font-size:10.5px;font-weight:900;border-radius:6px;padding:1px 7px}
.state.on{background:#2fd4b422;color:var(--teal)}.state.off{background:#ff6b6b22;color:var(--red)}

/* daily */
.daily{display:flex;align-items:center;gap:10px}
.ring{width:58px;height:58px;flex:none}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0a;font-size:13px}
.task:last-child{border:0}
.task .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#ffffff0a;flex:none}
.task .t{flex:1;min-width:0}
.task .t small{display:block;color:var(--muted);font-size:11px}
.task .mini{height:5px;border-radius:99px;background:#ffffff12;margin-top:4px;overflow:hidden}
.task .mini i{display:block;height:100%;background:var(--teal);border-radius:99px}
.task .pts{font-family:var(--f-num);color:var(--gold);font-weight:800;font-size:13px;flex:none}
.claim{background:var(--teal);color:#06221c;font-weight:900;font-size:12px;border-radius:99px;padding:5px 12px;flex:none}
.done{color:var(--teal);flex:none}

/* rewards gallery */
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{border-radius:16px;padding:12px;border:1px solid var(--line);background:var(--s1);position:relative}
.tier.lock{opacity:.6}
.tier-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tier-h b{font-size:13.5px}
.tier-h small{margin-inline-start:auto;font-size:11px;color:var(--muted)}
.tier .chip{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-num);font-size:11px;font-weight:800;color:#fff;flex:none}
.prev{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pv{background:#00000040;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);min-width:0;flex:1 1 90px}
.bubble{border-radius:14px 14px 4px 14px;padding:6px 10px;font-size:11.5px;color:var(--fg);max-width:100%}
.bubble.b2{background:linear-gradient(135deg,#2b3446,#1c2230);box-shadow:inset 0 0 0 1.5px #cfd8e3aa}
.bubble.b3{background:linear-gradient(135deg,#3b2a0b,#24190a);box-shadow:inset 0 0 0 1.5px #ffd45e,0 0 10px #ffd45e33}
.bubble.b4{background:linear-gradient(135deg,#0c3138,#0a1f26);box-shadow:inset 0 0 0 1.5px #5eead4,0 0 12px #5eead433}
.bubble.b5{background:linear-gradient(135deg,#341048,#1d0a2b);box-shadow:inset 0 0 0 1.5px #f0abfc,0 0 14px #f0abfc44}
.name-c2{color:#dbe6f3}.name-c3{color:#ffd45e}.name-c4{color:#5eead4}.name-c5{background:linear-gradient(90deg,#f0abfc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.entr{border-radius:99px;padding:4px 12px;font-size:11px;font-weight:800;white-space:nowrap}
.entr.e3{background:linear-gradient(90deg,#ffd45e33,transparent);box-shadow:inset 0 0 0 1px #ffd45e66;color:#ffe9a8}
.entr.e4{background:linear-gradient(90deg,#5eead433,transparent);box-shadow:inset 0 0 0 1px #5eead466;color:#b7fff3}
.entr.e5{background:linear-gradient(90deg,#f0abfc44,#a78bfa22,transparent);box-shadow:inset 0 0 0 1px #f0abfc88;color:#fde4ff}
.fr{width:46px;height:46px;border-radius:50%;position:relative;display:grid;place-items:center}
.fr .ava{width:36px;height:36px;font-size:13px}
.fr.f5::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#f0abfc,#a78bfa,#5eead4,#f0abfc);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.fr.f4::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#5eead4,#0e7490,#5eead4);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
.giftx{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,#ff5fa855,transparent 70%)}
.giftx svg{width:28px;height:28px;fill:var(--pink);stroke:#fff;stroke-width:1.2}

/* leaderboards */
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;font-size:12px;font-weight:800;padding:6px 0;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;text-align:center}
.pod{background:var(--s1);border-radius:16px 16px 10px 10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pod.p1{padding-top:16px;background:linear-gradient(180deg,#ffd45e26,var(--s1));box-shadow:inset 0 0 0 1px #ffd45e55}
.pod .rk{font-family:var(--f-num);font-size:12px;font-weight:800;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;color:#2b1b00}
.pod b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-size:10.5px;color:var(--muted)}
.pod .val{font-family:var(--f-num);color:var(--gold);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #ffffff0a}
.row:last-child{border:0}
.row .rn{width:22px;text-align:center;font-family:var(--f-num);color:var(--muted);flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:flex;gap:5px;align-items:center;font-size:13px;flex-wrap:wrap}
.row .t small{color:var(--muted);font-size:11px}
.row .v{text-align:end;flex:none}
.row .v b{display:block;font-family:var(--f-num);font-size:13px;color:var(--gold)}
.row .v small{font-size:10px;color:var(--muted)}
.mine{position:sticky;bottom:0;background:linear-gradient(90deg,#a46bff2e,#ff5fa81f);border:1px solid #a46bff66;border-radius:14px;padding:6px 8px}
.embs{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.embs svg{width:18px;height:18px;stroke:#fff;fill:#fff3}

/* room */
.room{background:radial-gradient(260px 160px at 50% 0%,#a46bff33,transparent 70%),linear-gradient(180deg,#1c1230,#100c19);min-height:100%;display:flex;flex-direction:column}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:16px 12px 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;min-width:0}
.seat .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{padding:8px 12px 14px;display:flex;flex-direction:column;gap:7px;margin-top:auto}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.6;flex-wrap:wrap}
.msg .nm{font-weight:900}
.msg .tx{color:#e6dcf5}
.banner{margin:4px 12px;align-self:flex-start}
.hostwrap{position:relative;display:inline-block}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:0;position:relative;height:84px}
.pair .owner-av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;background:#6a3fb8;box-shadow:0 0 0 3px #ffd45e,0 6px 20px #0006;position:relative;z-index:1}
.topfan{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-inline-start:-14px;position:relative;z-index:2;background:var(--phone);box-shadow:0 0 0 2.5px #ffd45e,0 0 12px #ffd45e88}
.topfan .ava{width:40px;height:40px;font-size:14px}
.topfan .crown{position:absolute;top:-13px;font-size:14px}
.topfan .lbl{position:absolute;bottom:-9px;background:linear-gradient(90deg,#ffd45e,#c27a0e);color:#2b1b00;font-size:8.5px;font-weight:900;border-radius:6px;padding:0 5px;white-space:nowrap}
.topfan.empty{box-shadow:0 0 0 1.5px #ffffff66;color:var(--gold);background:#0004}
.topfan.empty svg{width:18px;height:18px}
.fanseat{position:absolute;bottom:-4px;inset-inline-start:-18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--phone);box-shadow:0 0 0 2px var(--gold),0 0 10px #ffd45e66;z-index:2}
.fanseat .ava{width:22px;height:22px;font-size:10px}
.fanseat.empty{box-shadow:0 0 0 1.5px #ffffff55;border:0;color:var(--pink)}
.fanseat.empty svg{width:13px;height:13px}
.fanseat .crown{position:absolute;top:-9px;font-size:10px;color:var(--gold)}
.rtools{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px}
.rtools .seg{flex:1;min-width:150px}
.sys{font-size:11.5px;color:#ffe9a8;background:#ffd45e14;border-radius:10px;padding:5px 10px;margin:0 12px;align-self:flex-start}

/* help */
.help h4{margin:0 0 6px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td{padding:7px 4px;border-bottom:1px solid #ffffff0a}
.tbl td:last-child{text-align:end;font-family:var(--f-num);color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.7}
.step span{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--f-num);font-size:11px;flex:none;margin-top:2px}
.lvtab{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10px;text-align:center}
.lvtab div{border-radius:8px;padding:5px 2px;color:#fff}
.lvtab b{display:block;font-family:var(--f-num);font-size:11px}
.toast{position:absolute;bottom:18px;inset-inline:30px;background:#000e;border-radius:12px;padding:9px 12px;text-align:center;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.sheet{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--s1);border-radius:20px 20px 0 0;padding:16px;width:100%;display:flex;flex-direction:column;gap:10px}
.sheet h4{margin:0;font-size:15px}
.r2{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #ffffff0a;padding:6px 0}
.r2 span{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" dir="rtl">
  <h1>نادي المعجبين النهائي</h1>
  <p class="lead">كل شاشة في نادي المعجبين بشكلها النهائي، ومعها مواصفات التنفيذ. كل المزايا مرسومة بالـCSS بلا صور ثقيلة، ما عدا صورة الهدية الحصرية. الأسماء والأرقام أمثلة.</p>
  <div class="tabsx" id="tabs"></div>
  <div class="layout">
    <div class="phone" id="phone"><div class="scr" id="scr"></div><div class="toast" id="toast"></div></div>
    <div class="spec" id="spec"></div>
  </div>
</div>

<script>
(() => {
const P = {
  back:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  gift:'<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const ic=(n,s='')=>`<svg class="i" viewBox="0 0 24 24" ${s}>${P[n]}</svg>`;
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-US');
const TIERS=[['برونزي','t1','var(--t1a)','var(--t1b)',1],['فضي','t2','var(--t2a)','var(--t2b)',5],['ذهبي','t3','var(--t3a)','var(--t3b)',9],['بلاتيني','t4','var(--t4a)','var(--t4b)',13],['أسطوري','t5','var(--t5a)','var(--t5b)',17]];
const TH=[0,200,600,1500,3000,6000,10000,16000,25000,40000,60000,90000,130000,180000,250000,350000,500000,700000,1000000,1500000];
const tierOf=l=>TIERS[Math.min(4,Math.floor((l-1)/4))];
const fb=(club,l,off)=>{const t=tierOf(l);return `<span class="fb ${t[1]} ${off?'off':''}"><span class="lv">${l}</span>${club}</span>`;};
const colors=['#6a3fb8','#2f7d6d','#a8466f','#3d5fa8','#8a5a1f','#5b3f8f','#2f6f8f','#7d2f5a'];
const av=(n,i)=>`<span class="ava" style="background:${colors[i%colors.length]}">${n[0]}</span>`;
const CLUB='عشّاق الطرب';
const state={screen:'guest',lbRange:'week',fansRange:'week',fanSeat:'full',viewer:'guest'};

function ring(a,b){const r=24,c=2*Math.PI*r,f=c*Math.min(1,a/b);return `<svg class="ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="#ffffff14" stroke-width="6"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 29 29)"/><text x="29" y="33" text-anchor="middle" fill="var(--fg)" font-family="Baloo Bhaijaan 2,Cairo" font-size="12" font-weight="800">${Math.round(a/b*100)}%</text></svg>`;}

const heroHTML=(extra='')=>`<div class="hero"><div class="seg" style="width:100%;margin-bottom:6px"><button data-fs="full" class="${state.fanSeat==='full'?'on':''}">المعجب الأول موجود</button><button data-fs="empty" class="${state.fanSeat==='full'?'':'on'}">المقعد فارغ</button></div><div class="pair"><span class="owner-av">ل</span>${state.fanSeat==='full'?`<button class="topfan" data-fanseat aria-label="المعجب الأول"><span class="crown">👑</span>${av('ريم',6)}<span class="lbl">المعجب الأول</span></button>`:`<button class="topfan empty" data-fanseat aria-label="مقعد المعجب الأول فارغ">${ic('plus')}<span class="lbl">المعجب الأول</span></button>`}</div><h3>${CLUB}</h3><span class="owner">نادي ليان · <span class="num">1,379</span> متابعاً</span>
  <div class="stats3"><div><b>386</b><small>عضواً</small></div><div><b>142</b><small>نشطون هذا الأسبوع</small></div><div><b class="num">#4</b><small>ترتيب النادي</small></div></div>${extra}</div>`;
const topbar=(title,right='')=>`<div class="top"><button class="ib" data-toast="رجوع" aria-label="رجوع">${ic('back')}</button><h2>${title}</h2>${right||'<span style="width:34px"></span>'}</div>`;
const helpBtn=`<button class="ib" data-go="help" aria-label="ما هو نادي المعجبين">${ic('info')}</button>`;

function tiersGallery(myLevel){
  const rows=[
    [1,'شارة النادي + فرصة مقعد المعجب الأول',`<div class="pv">${fb(CLUB,3)}<span>في قائمة المشاهدين وبطاقة ملفك</span></div><div class="pv">${fb(CLUB,3,true)}<span>رمادية إذا صرت غير نشط</span></div>`],
    [5,'لون اسم + فقاعة دردشة فضية',`<div class="pv"><span class="bubble b2"><b class="name-c2">ريم</b> مساء الخير</span><span>فقاعة دردشة فضية</span></div>`],
    [9,'إعلان دخول + فقاعة ذهبية',`<div class="pv"><span class="entr e3">✦ ريم دخلت الغرفة</span><span>إعلان دخول ذهبي</span></div><div class="pv"><span class="bubble b3"><b class="name-c3">ريم</b> وصلت</span><span>فقاعة ذهبية</span></div>`],
    [13,'الهدية الحصرية + إطار صورة',`<div class="pv"><span class="giftx">${ic('heart')}</span><span>هدية النادي 500</span></div><div class="pv"><span class="fr f4">${av('ر',6)}</span><span>إطار بلاتيني</span></div><div class="pv"><span class="bubble b4"><b class="name-c4">ريم</b> 🎉</span><span>فقاعة بلاتينية</span></div>`],
    [17,'أسطورة النادي',`<div class="pv"><span class="fr f5">${av('ر',6)}</span><span>إطار متحرك</span></div><div class="pv"><span class="entr e5">✦✦ أسطورة النادي ريم دخلت</span><span>إعلان أسطوري</span></div><div class="pv"><span class="bubble b5"><b class="name-c5">ريم</b> 👑</span><span>فقاعة أسطورية</span></div>`]
  ];
  return `<div class="tiers">${rows.map(([l,title,prev])=>{const t=tierOf(l);const lock=myLevel==null||myLevel<l;return `<div class="tier ${lock?'lock':''}" style="${lock?'':'border-color:'+t[2]}"><div class="tier-h"><span class="chip" style="background:linear-gradient(135deg,${t[2]},${t[3]})">${l}+</span><b>${title}</b><small>${t[0]}</small>${lock?ic('lock','style="width:15px;height:15px;color:var(--dim)"'):`<span style="color:var(--teal)">${ic('check','style="width:16px;height:16px"')}</span>`}</div><div class="prev">${prev}</div></div>`;}).join('')}</div>`;
}

const S={
  guest:{label:'غير عضو',render(){return topbar('نادي المعجبين',helpBtn)+heroHTML()+`<div class="pad">
    <div class="card" style="display:flex;gap:10px;align-items:center">${ic('heart','style="color:var(--pink);width:22px;height:22px"')}<p class="note" style="flex:1">انضم بتذكرة النادي لليان. تصلها كهدية، وتبدأ من المستوى 1، وتحصل على شارة النادي فوراً.</p></div>
    <button class="btn p" data-join>انضم إلى النادي <span class="price">${ic('gift','style="width:14px;height:14px"')} 100</span></button>
    <p class="note" style="text-align:center">تتابع ليان ✓ · المتابعة شرط للانضمام</p>
    <div class="sec-h" style="margin:6px 2px 0">ماذا تحصل في كل مستوى <small>كلها داخل غرفة ليان</small></div>
    ${tiersGallery(null)}
    <button class="btn s" data-go="fans">${ic('trophy')} أعلى المعجبين هذا الأسبوع</button></div>`;},
  spec:`<h2>غير عضو</h2><ul>
    <li><b>زر الانضمام:</b> السعر <b>داخل</b> الزر كشارة صغيرة، وليس بارزاً تحته (كان مكسوراً على الهاتف). إذا لم يكن متابعاً، يتحول الزر نفسه إلى «تابع أولاً» ثم «انضم».</li>
    <li><b>بعد الضغط:</b> نافذة تأكيد فيها السعر والرصيد بعد الخصم. وعند الرفض تظهر <b>رسالة الخادم واضحة فوق النافذة</b>، مثلاً: «هذا الحساب مرتبط بحسابك (نفس الجهاز)، فلا يمكنك الانضمام لناديه».</li>
    <li><b>احذف</b> عبارة «ستحصل على إطار المساهم». هذا الإطار يحصل عليه فقط المساهم الأول في الأسبوع، وليس كل من ينضم.</li>
    <li><b>معرض المزايا:</b> كل فئة تُعرض بشكلها الحقيقي (شارة، فقاعة، إعلان، إطار، هدية)، لا كلام فقط.</li><li><b>مقعد المعجب الأول (مثل Likee):</b> في رأس الصفحة، صورة مصغّرة بتاج ذهبي ملاصقة لصورة المضيف، فيها المعجب الأول هذا الأسبوع (أعلى نقاط أسبوعية، نشط، غير مرتبط). يتحدث مباشرة. الضغط: غير عضو → يبقى على صفحة الانضمام مع رسالة؛ عضو → «أعلى المعجبين» مع ترتيبه وما ينقصه. فارغ → «+». جرّب الزرين أعلى الصفحة.</li></ul>
    <div class="warn">سبب «الانضمام لا يعمل» على الأرجح: حسابك ورورو على نفس الهاتف، فهما مرتبطان، والخادم يرفض الانضمام عمداً، لكن الرسالة تختفي خلف النافذة أو غير واضحة.</div>`},
  member:{label:'عضو',render(){const lvl=7,pts=11800,cur=TH[lvl-1],nxt=TH[lvl];const t=tierOf(lvl);
    return topbar('نادي المعجبين',helpBtn)+heroHTML()+`<div class="pad">
    <div class="card"><div class="lvcard"><span class="bigl" style="background:linear-gradient(135deg,${t[2]},${t[3]})">${lvl}<small>${t[0]}</small></span><div style="flex:1;min-width:0">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>مستواك ${lvl}</b>${fb(CLUB,lvl)}<span class="state on">نشط</span></div>
      <div class="bar"><i style="width:${Math.round((pts-cur)/(nxt-cur)*100)}%;background:linear-gradient(90deg,${t[2]},${t[3]})"></i></div>

    <div class="card"><div class="daily">${ring(230,400)}<div style="flex:1"><b style="font-size:13.5px">نقاط اليوم المجانية <span class="num">230 / 400</span></b><p class="note">تتجدد منتصف الليل بتوقيت دمشق. الهدايا بلا حد: كل كوين = نقطة.</p></div></div>

      <div class="task"><span class="ti">${ic('cal')}</span><span class="t">تسجيل الحضور</span><span class="pts">+50</span><button class="claim" data-toast="+50 نقطة">سجّل</button></div>
      <div class="task"><span class="ti">${ic('msg')}</span><span class="t">3 رسائل في غرفة ليان<small><span class="num">3/3</span></small><div class="mini"><i style="width:100%"></i></div></span><span class="pts">+50</span><span class="done">${ic('check')}</span></div>
      <div class="task"><span class="ti">${ic('clock')}</span><span class="t">استمع أثناء بث ليان<small><span class="num">13/30</span> دقيقة · 10 نقاط للدقيقة</small><div class="mini"><i style="width:43%"></i></div></span><span class="pts">130/300</span></div>
      <div class="task"><span class="ti">${ic('gift')}</span><span class="t">هدايا لليان<small>اليوم: <span class="num">1,200</span> نقطة</small></span><span class="pts">∞</span></div></div></div>
    <div class="sec-h" style="margin:4px 2px 0">مزاياك <small>المستوى 7: فتحت 2 من 5</small></div>

    <button class="btn s" data-go="fans">${ic('trophy')} أعلى المعجبين · ترتيبك <span class="num">#12</span></button>

  spec:`<h2>عضو</h2><ul>

    <li><b>حلقة «نقاط اليوم المجانية X / 400»:</b> مجموع الحضور والدردشة والاستماع. ويوضح أن الهدايا بلا حد.</li>
    <li><b>كل مهمة لها شريط تقدم صغير</b> (الرسائل 3/3، الاستماع 13/30). ويتحدث مباشرة عبر socket بدون إعادة فتح.</li>
    <li>زر «سجّل» يتحول إلى ✓ فوراً (تغيير فوري ثم يرجع إذا فشل).</li>
    <li>غير نشط: البطاقة تقول «غير نشط — اكسب أي نقطة لتعود»، والشارة رمادية.</li>
    <li>المغادرة: تأكيد يذكر المستوى والنقاط التي ستضيع بالأرقام.</li></ul>`},
  owner:{label:'صاحب النادي',render(){return topbar('ناديّ',helpBtn)+heroHTML(`<button class="price" style="margin-top:8px;font-family:var(--f-ui);font-size:12px" data-toast="تعديل الاسم (13 حرفاً، يمر على فلتر الألفاظ)">${ic('pen','style="width:13px;height:13px"')} تعديل الاسم</button>`)+`<div class="pad">
    <div class="card"><div class="sec-h">هذا الأسبوع</div><div class="stats3" style="margin:0"><div style="background:var(--s2)"><b>+18</b><small>أعضاء جدد</small></div><div style="background:var(--s2)"><b class="num">96,400</b><small>نقاط النادي</small></div><div style="background:var(--s2)"><b>142</b><small>نشطون</small></div></div></div>
    <div class="card"><div class="sec-h">الهوية</div>
      <div class="task"><span class="ti" style="background:linear-gradient(135deg,var(--pink),var(--accent))">${ic('heart','style="stroke:#fff"')}</span><span class="t">لون الشعار<small>5 ألوان</small></span><button class="claim" style="background:var(--s2);color:var(--fg)" data-toast="اختيار اللون">تغيير</button></div>

    <button class="btn s" data-toast="قائمة الأعضاء: 20 في كل مرة">${ic('user')} كل الأعضاء (386)</button></div>`;},
  spec:`<h2>صاحب النادي</h2><ul>
    <li>بدل عرض مهام وأزرار انضمام لا معنى لها لصاحب النادي: إحصائيات الأسبوع، والهوية (الاسم، ولون الشعار، ولون الهدية)، وأعلى المعجبين، والأعضاء.</li>
    <li>اسم النادي يُفحص بفلتر الألفاظ، ويظهر سبب الرفض بوضوح.</li></ul>`},
  room:{label:'داخل الغرفة',render(){
    const seats=[['ليان',0,null,'مضيفة'],['ريم',6,18,''],['سامر',3,14,''],['هبة',4,10,''],['نور',2,6,''],['أبو كرم',1,2,''],['',0,null,''],['',0,null,'']];
    const full=state.fanSeat==='full';

    const ring=(n,i,l)=>l>=17?`<span class="fr f5">${av(n,i)}</span>`:l>=13?`<span class="fr f4">${av(n,i)}</span>`:`<span class="fr">${av(n,i)}</span>`;
    const nameCls=l=>l>=17?'name-c5':l>=13?'name-c4':l>=9?'name-c3':l>=5?'name-c2':'';

    <div class="seats">${hostSeat}${seats.slice(1).map(([n,i,l])=>n?`<div class="seat">${ring(n,i,l)}<span class="nm ${nameCls(l)}">${n}</span></div>`:`<div class="seat"><span class="fr"><span class="ava" style="background:transparent;border:1.5px dashed #ffffff26;width:36px;height:36px"></span></span><span class="nm" style="color:var(--dim)">فارغ</span></div>`).join('')}</div>
    <span class="entr e5 banner">✦✦ أسطورة النادي ريم دخلت الغرفة</span>

  spec:`<h2>داخل غرفة المضيف</h2><ul>

    <li>لا وعود بمكافآت مالية. الأسبوع الماضي يُحفظ في جدول نتائج أسبوعية (يُكتب مرة واحدة كل أحد)، ولا يُعاد حسابه.</li></ul>`},
  fans:{label:'أعلى المعجبين',render(){
    const fans=[['ريم',6,18,42100],['سامر',3,14,31800],['هبة',4,10,22050],['نور',2,6,12400],['أبو كرم',1,2,8100],['ليلى',7,5,5300]];
    return topbar('أعلى معجبي ليان')+`<div class="pad">
    <div class="seg"><button data-fr="week" class="${state.fansRange==='week'?'on':''}">هذا الأسبوع</button><button data-fr="all" class="${state.fansRange==='all'?'on':''}">كل الوقت</button></div>
    <div class="card" style="display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#ffd45e1f,var(--s1))"><span class="fr f5" style="width:40px;height:40px">${av('ر',6)}</span><p class="note" style="flex:1"><b style="color:var(--gold)">الأول هذا الأسبوع</b> يجلس في <b>مقعد المعجب الأول</b> بجانب ليان طوال الأسبوع، ويحصل على «إطار المساهم» 7 أيام يوم الأحد. الحسابات المرتبطة بالمضيف لا تُحسب.</p></div>
    <div class="podium">${[1,0,2].map(k=>{const f=fans[k];const rk=k+1;return `<div class="pod ${rk===1?'p1':''}"><span class="rk" style="background:${['#ffd45e','#cfd8e3','#c9773a'][k]}">${rk}</span>${av(f[0],f[1])}<b>${f[0]}</b>${fb(CLUB,f[2])}<span class="val">${fmt(f[3])}</span></div>`;}).join('')}</div>
    <div class="card" style="padding:4px 10px">${fans.slice(3).map((f,i)=>`<div class="row"><span class="rn">${i+4}</span>${av(f[0],f[1])}<span class="t"><b>${f[0]} ${fb(CLUB,f[2])}</b></span><span class="v"><b>${fmt(f[3])}</b><small>نقطة</small></span></div>`).join('')}</div>
    <div class="row mine"><span class="rn">12</span>${av('ب',5)}<span class="t"><b>أنت ${fb(CLUB,7)}</b><small>ينقصك <span class="num">1,900</span> نقطة للمركز 11</small></span><span class="v"><b>3,400</b><small>نقطة</small></span></div></div>`;},
  spec:`<h2>أعلى المعجبين</h2><ul>
    <li>تبويبان: هذا الأسبوع (نقاط الأسبوع)، وكل الوقت (إجمالي النقاط = المستوى).</li>
    <li>بطاقة توضح جائزة الأول: «إطار المساهم» 7 أيام يوم الأحد. هذا هو المكان الصحيح لذكرها.</li>
    <li>منصة لأول 3 مع الشارة، وقائمة، وسطرك مثبّت مع ما ينقصك.</li>
    <li>تُقرأ من FanClubWeekly ومن العضويات، مقسّمة صفحات، بلا مرتبطين.</li></ul>`},
  help:{label:'شرح النادي (!)',render(){
    return topbar('ما هو نادي المعجبين؟')+`<div class="pad help">
    <div class="card"><h4>فكرة النادي</h4><p class="note">كل مضيف له نادي معجبين. عندما تنضم تحصل على شارة باسم النادي تظهر بجانب اسمك في غرفته، وكلما دعمته وتفاعلت معه ارتفع مستواك وفتحت مزايا أجمل.</p></div>
    <div class="card"><h4>كيف تنضم</h4><div class="steps"><div class="step"><span>1</span>تابع المضيف.</div><div class="step"><span>2</span>اضغط «انضم» وادفع تذكرة النادي (100 كوينز). تصل للمضيف كهدية.</div><div class="step"><span>3</span>تبدأ من المستوى 1 مع 200 نقطة (التذكرة + مكافأة المتابعة).</div></div></div>
    <div class="card"><h4>كيف تكسب النقاط</h4><table class="tbl">
      <tr><td>تسجيل الحضور اليومي</td><td>50</td></tr><tr><td>3 رسائل في غرفة المضيف</td><td>50</td></tr><tr><td>الاستماع أثناء بثه (حتى 30 دقيقة)</td><td>10 / دقيقة</td></tr><tr><td>الهدايا للمضيف</td><td>1 / كوين</td></tr></table>
      <p class="note" style="margin-top:6px">الحد المجاني اليومي 400 نقطة. الهدايا بلا حد.</p></div>
    <div class="card"><h4>المستويات</h4><div class="lvtab">${TIERS.map((t,k)=>`<div style="background:linear-gradient(135deg,${t[2]},${t[3]})"><b>${t[4]}–${t[4]+3}</b>${t[0]}</div>`).join('')}</div>
      <p class="note" style="margin-top:6px">20 مستوى في 5 فئات. المستوى 9 يحتاج 25,000 نقطة، والمستوى 20 يحتاج 1,500,000.</p></div>
    <div class="card"><h4>النشاط</h4><p class="note">إذا لم تكسب أي نقطة 7 أيام تصبح «غير نشط»: شارتك رمادية ومزاياك متوقفة، <b>لكنك لا تخسر نقاطك</b>. أي نقطة جديدة تعيدك فوراً.</p></div>
    <div class="card"><h4>مهم</h4><p class="note">المزايا شكلية داخل غرفة المضيف. النقاط لا تتحول إلى مال أو كوينز. والحسابات المرتبطة بالمضيف (نفس الجهاز) لا تستطيع الانضمام لناديه. المغادرة تحذف نقاطك نهائياً.</p></div></div>`;},
  spec:`<h2>زر «!» (شرح النادي)</h2><ul>
    <li>صفحة شرح كاملة، تُفتح من «!» في كل شاشات النادي.</li>
    <li><b>كل الأرقام فيها تأتي من الخادم</b> (السعر، والنقاط، والحد اليومي، والعتبات). إذا غيّرها الأدمن يتغير الشرح وحده، فلا يكذب الشرح أبداً.</li>
    <li>تتضمن: الفكرة، وخطوات الانضمام، وجدول النقاط، والفئات، والنشاط، والتنبيهات المهمة.</li></ul>`}
};

function render(){
  const s=S[state.screen];
  $('scr').innerHTML=s.render(); $('scr').scrollTop=0;
  $('spec').innerHTML=s.spec;
  $('tabs').innerHTML=Object.entries(S).map(([k,v])=>`<button data-s="${k}" class="${state.screen===k?'on':''}">${v.label}</button>`).join('');
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800);}
function sheet(title,rows,cta,done,danger){const d=document.createElement('div');d.className='sheet';
  d.innerHTML=`<div><h4>${title}</h4>${rows.map(([a,b])=>`<div class="r2"><span>${a}</span><b>${b}</b></div>`).join('')}<div style="display:flex;gap:8px"><button class="btn s" data-x>إلغاء</button><button class="btn p" data-x data-ok style="${danger?'background:var(--red)':''}">${cta}</button></div></div>`;
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]')){const ok=e.target.closest('[data-ok]');d.remove();if(ok)done();}});$('phone').appendChild(d);}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.s){state.screen=t.dataset.s;render();return;}
  if(t.dataset.go){state.screen=t.dataset.go;render();return;}
  if(t.dataset.fs){state.fanSeat=t.dataset.fs;render();return;}
  if(t.dataset.vw){state.viewer=t.dataset.vw;render();return;}
  if(t.hasAttribute('data-fanseat')){if(state.screen==='guest'){toast('انضم للنادي لتنافس على مقعد المعجب الأول');}else{state.screen='fans';render();toast(state.screen==='fans'?'ترتيبك وما ينقصك لتصبح الأول':'');}return;}
  if(t.dataset.lb){state.lbRange=t.dataset.lb;render();return;}
  if(t.dataset.fr){state.fansRange=t.dataset.fr;render();return;}
  if(t.hasAttribute('data-join')){sheet('الانضمام إلى عشّاق الطرب',[['تذكرة النادي','100 كوينز'],['رصيدك بعد الخصم','48,150'],['تبدأ من','المستوى 1 · 200 نقطة']],'ادفع وانضم',()=>{state.screen='member';render();toast('أهلاً بك في عشّاق الطرب');});return;}
  if(t.hasAttribute('data-leave')){sheet('مغادرة عشّاق الطرب؟',[['مستواك','7'],['نقاطك التي ستُحذف','11,800']],'غادر',()=>{state.screen='guest';render();toast('غادرت النادي');},true);return;}
  if(t.dataset.toast)toast(t.dataset.toast);
});
render();
})();
</script>
